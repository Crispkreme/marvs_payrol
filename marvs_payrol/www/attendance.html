{% extends "templates/web.html" %}

{% block page_content %}

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h3 class="mb-4 text-center">Daily Time Record</h3>

        <div class="text-end mb-4">
            <small class="text-muted">Current Date & Time</small><br>
            <strong id="current_datetime">-</strong>
        </div>

        <!-- =========================
             EMPLOYEE INPUT
        ========================== -->
        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" id="employee" class="form-control" placeholder="Enter Employee ID">
        </div>

        <!-- EMPLOYEE NAME -->
        <div class="mb-3">
            <small class="text-muted">Employee Name</small><br>
            <strong id="employee-name">-</strong>
        </div>

        <hr>

        <!-- =========================
             ATTENDANCE BUTTON
        ========================== -->
        <button id="attendance-btn" class="btn btn-primary w-100">
            Record Attendance
        </button>

        <!-- MESSAGE -->
        <div class="mt-3" id="message"></div>

        <hr>

        <!-- =========================
             HISTORY
        ========================== -->
        <h5 class="mb-3">Attendance History</h5>

        <div class="table-responsive">

            <table class="table table-bordered table-sm align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Time in (am)</th>
                        <th>Time out (am)</th>
                        <th>Time in (pm)</th>
                        <th>Time out (pm)</th>
                    </tr>
                </thead>

                <tbody id="history-body">
                    <!-- JS will populate here -->
                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
