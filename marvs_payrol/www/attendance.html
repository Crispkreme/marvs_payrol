{% extends "templates/web.html" %}

{% block page_content %}

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h3 class="mb-4">Daily Time Record</h3>

        <!-- =========================
             EMPLOYEE INPUT
        ========================== -->
        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" id="employee" class="form-control" placeholder="Enter Employee ID">
        </div>

        <!-- EMPLOYEE NAME -->
        <div class="mb-3">
            <small class="text-muted">Employee Name</small><br>
            <strong id="employee-name">-</strong>
        </div>

        <hr>

        <!-- =========================
             TIME IN / OUT
        ========================== -->
        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">AM Time In</label>
                <input type="time" id="am_time_in" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">AM Time Out</label>
                <input type="time" id="am_time_out" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">PM Time In</label>
                <input type="time" id="pm_time_in" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">PM Time Out</label>
                <input type="time" id="pm_time_out" class="form-control">
            </div>

        </div>

        <!-- =========================
             ATTENDANCE BUTTON
        ========================== -->
        <button id="attendance-btn" class="btn btn-primary w-100">
            Record Attendance
        </button>

        <!-- MESSAGE -->
        <div class="mt-3" id="message"></div>

        <hr>

        <!-- =========================
             HISTORY
        ========================== -->
        <h5 class="mb-3">Attendance History</h5>

        <div class="table-responsive">

            <table class="table table-bordered table-sm align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <th>AM In</th>
                        <th>AM Out</th>
                        <th>PM In</th>
                        <th>PM Out</th>
                        <th>Hours</th>
                        <th>Late (min)</th>
                        <th>OT (hrs)</th>
                    </tr>
                </thead>

                <tbody id="history-body">
                    <!-- JS will populate here -->
                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
