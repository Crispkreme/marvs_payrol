{% extends "templates/web.html" %}

{% block page_content %}

<div class="container mt-5">

    <div class="card shadow-sm p-4">

        <h3 class="mb-4">Leave Request Form</h3>

        <!-- Date -->
        <div class="text-end mb-4">
            <small class="text-muted">Current Date & Time</small><br>
            <strong id="current_datetime">-</strong>
        </div>

        <!-- Employee ID -->
        <div class="mb-3">
            <label class="form-label">Employee ID</label>
            <input type="text" id="employee" class="form-control" placeholder="Enter Employee ID">
        </div>

        <!-- Employee Info -->
        <div class="row mb-4">

            <div class="col-md-6">
                <small class="text-muted">Employee Name</small><br>
                <strong id="employee-name">-</strong>
            </div>

            <div class="col-md-3">
                <small class="text-muted">Employee Status</small><br>
                <strong id="employee-status">-</strong>
            </div>

            <div class="col-md-3">
                <small class="text-muted">Request Status</small><br>
                <strong id="request_status">Pending</strong>
            </div>

        </div>

        <!-- Leave Type -->
        <div class="mb-3">
            <label class="form-label">Leave Type</label>
            <select id="leave_type" class="form-control">
                <option value="Vacation Leave">Vacation Leave</option>
                <option value="Sick Leave">Sick Leave</option>
                <option value="Emergency Leave">Emergency Leave</option>
            </select>
        </div>

        <!-- Dates -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">From Date</label>
                <input type="date" id="from_date" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">To Date</label>
                <input type="date" id="to_date" class="form-control">
            </div>
        </div>

        <!-- Reason -->
        <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea id="reason" class="form-control" rows="4"></textarea>
        </div>

        <!-- Submit -->
        <button id="submit" class="btn btn-primary w-100">
            Submit Leave Request
        </button>

        <!-- Message -->
        <div id="message" class="mt-3"></div>

    </div>
</div>

{% endblock %}
