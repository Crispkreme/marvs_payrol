{% extends "templates/web.html" %}

{% block page_content %}

<div class="page-card" style="max-width:420px;margin:100px auto">

    <div class="page-card-head">
        <h3>Employee Login</h3>
    </div>

    <form id="employee-login-form">

        <div class="page-card-body">

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    autocomplete="off"
                    required>
            </div>

            <div class="form-group mt-3">
                <label>Employee ID</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    autocomplete="off"
                    required>
            </div>

            <button
                type="button"
                class="btn btn-primary btn-block mt-3"
                id="employee_login_btn">
                Login
            </button>

            <p id="msg" style="margin-top:15px"></p>

        </div>

    </form>

</div>

{% endblock %}

{% block footer %}
<script>

    console.log("EMPLOYEE LOGIN JS LOADED");

    document.getElementById("employee_login_btn").addEventListener("click", function() {
        alert("Button works");
    });

    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("employee-login-form");
        const btn = document.getElementById("employee_login_btn");
        const msg = document.getElementById("msg");

        if (!btn) {
            console.error("Button not found");
            return;
        }

        // Stop ALL form submissions
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });

        btn.addEventListener("click", function(e) {

            e.preventDefault();
            e.stopPropagation();

            console.log("LOGIN CLICKED");

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            frappe.call({
                method: "marvs_payrol.www.employee_login.employee_login",
                args: {
                    email: email,
                    password: password
                },
                callback: function(r) {

                    console.log(r);

                    if (!r.message) {
                        msg.innerHTML = "Invalid Email or Employee ID";
                        msg.style.color = "red";
                        return;
                    }

                    localStorage.setItem(
                        "employee",
                        JSON.stringify(r.message)
                    );

                    msg.innerHTML = "Login Success";
                    msg.style.color = "green";

                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 1000);
                }
            });

            return false;
        });

    });
    
</script>
{% endblock %}
