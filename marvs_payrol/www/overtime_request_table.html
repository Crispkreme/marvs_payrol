{% extends "templates/web.html" %}

{% block page_content %}

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>⏱️ Overtime Requests</h2>

        <div>
            <button class="btn btn-outline-primary btn-sm" onclick="goHome()">
                🏠 Home
            </button>

            <button class="btn-request" onclick="goOTForm()">
                + Request OT
            </button>
        </div>
    </div>

    <!-- TABLE -->
    <table class="table">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Date</th>
                <th>Type</th>
                <th>Start</th>
                <th>End</th>
                <th>Hours</th>
                <th>Status</th>
                <th>Reason</th>
            </tr>
        </thead>

        <tbody id="otTable">
            <tr><td colspan="8">Loading...</td></tr>
        </tbody>
    </table>

</div>

<style>

.container {
    max-width: 1000px;
    margin: 40px auto;
    font-family: Arial;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

/* BUTTON */
.btn-request {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.btn-request:hover {
    background: #0056b3;
}

/* TABLE */
.table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}

.table th, .table td {
    padding: 10px;
    border: 1px solid #eee;
    text-align: center;
}

.table th {
    background: #f5f5f5;
}

</style>

{% endblock %}

{% block script %}

<script src="/assets/marvs_payrol/js/overtime_request_table.js"></script>

<script>
function goOTForm() {
    window.location.href = "/overtime-request";
}

function goHome() {
    window.location.href = "/dashboard";
}
</script>

{% endblock %}
